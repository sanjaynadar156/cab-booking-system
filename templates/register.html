
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CabGo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 0;
        }

        .register-box {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: #1c1c1c;
            border: 1px solid #f5c400;
            border-radius: 15px;
            box-shadow: 0 0 25px #f5c40022;
        }

        h1 {
            text-align: center;
            color: #f5c400;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 25px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #f5c400;
            border-radius: 7px;
            color: #f5c400;
            text-align: center;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 7px;
            background: #292929;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #f5c400;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #f5c400;
            color: #111;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffda36;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.8;
        }

        a {
            color: #f5c400;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h1>🚕 CabGo</h1>
        <p class="subtitle">Create your account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/register" method="POST">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <div class="links">
            Already have an account?
            <a href="/login">Login here</a>
            <br>
            <a href="/">← Back to Home</a>
        </div>
    </div>
</body>
</html>
